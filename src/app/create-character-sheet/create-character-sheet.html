<section>
  <h1>Criação de Colaborador (ARC)</h1>

  <p *ngIf="isAtCharacterLimit">Sinto muito, seu eu exterior pode ter apenas 3 colaboradores nessa filial (que formidável você hein?)</p>

  <div class="steps-row">
    <button
      type="button"
      *ngFor="let step of steps"
      [disabled]="step.key === currentStep"
      (click)="currentStep = step.key"
      [ngClass]="{
        'step-anomaly': step.key === 'anomaly',
        'step-reality': step.key === 'reality',
        'step-competency': step.key === 'competency',
        'step-active': step.key === currentStep,
        'current-step-anomaly': step.key === 'anomaly' && currentStep === 'anomaly',
        'current-step-reality': step.key === 'reality' && currentStep === 'reality',
        'current-step-competency': step.key === 'competency' && currentStep === 'competency'
      }"
    >
      {{ step.label }}
    </button>
  </div>

  <div *ngIf="currentStep === 'anomaly'" class="form-panel panel-anomaly">
    <h2>Anomalia</h2>

    <label>
      Nome do agente
      <input type="text" [(ngModel)]="character.name" name="name" />
    </label>

    <label>
      Pronomes
      <input type="text" [(ngModel)]="character.pronouns" name="pronouns" placeholder="Ex.: ela/dela, ele/dele, elu/delu" />
    </label>

    <label>
      Anomalia
      <select [(ngModel)]="character.anomaly.name" name="anomalyName">
        <option value="">Selecione</option>
        <option *ngFor="let option of anomalyOptions" [value]="option">{{ option }}</option>
      </select>
    </label>

    <label>
      Descrição da anomalia
      <textarea rows="4" [(ngModel)]="character.anomaly.description" name="anomalyDescription"></textarea>
    </label>

    <fieldset>
      <legend>Equipamentos</legend>

      <div *ngIf="(character.anomaly.equipment ?? []).length; else noEquipment">
        <div *ngFor="let item of character.anomaly.equipment ?? []; let index = index; trackBy: trackByEquipment" class="equipment-row">
          <label>
            Nome
            <input type="text" [(ngModel)]="item.name" [name]="'equipmentName' + index" placeholder="Ex.: Chave de bronze" />
          </label>

          <label>
            Descrição
            <textarea rows="2" [(ngModel)]="item.description" [name]="'equipmentDescription' + index" placeholder="Descreva o equipamento"></textarea>
          </label>

          <button type="button" (click)="removeEquipment(index)">Remover</button>
        </div>
      </div>

      <ng-template #noEquipment>
        <p>Nenhum equipamento adicionado ainda.</p>
      </ng-template>

      <button type="button" (click)="addEquipment()">Adicionar equipamento</button>
    </fieldset>
  </div>

  <div *ngIf="currentStep === 'reality'" class="form-panel panel-reality">
    <h2>Realidade</h2>

    <label>
      Realidade
      <select [(ngModel)]="character.reality.name" name="realityName">
        <option value="">Selecione</option>
        <option *ngFor="let option of realityOptions" [value]="option">{{ option }}</option>
      </select>
    </label>

    <label>
      Descrição da realidade
      <textarea rows="4" [(ngModel)]="character.reality.description" name="realityDescription"></textarea>
    </label>

    <label>
      Gatilho da realidade
      <textarea rows="3" [(ngModel)]="character.reality.gatilho" name="realityTrigger"></textarea>
    </label>

    <label>
      Alívio de burnout
      <textarea rows="3" [(ngModel)]="character.reality.alivio" name="realityRelief"></textarea>
    </label>
  </div>

  <div *ngIf="currentStep === 'competency'" class="form-panel panel-competency">
    <h2>Competência</h2>

    <label>
      Competência
      <select [(ngModel)]="character.competency.name" name="competencyName">
        <option value="">Selecione</option>
        <option *ngFor="let option of competencyOptions" [value]="option">{{ option }}</option>
      </select>
    </label>

    <label>
      Descrição da competência
      <textarea rows="4" [(ngModel)]="character.competency.description" name="competencyDescription"></textarea>
    </label>

    <label>
      Mérito
      <textarea rows="3" [(ngModel)]="character.competency.merito" name="competencyMerit"></textarea>
    </label>

    <label>
      Demérito
      <textarea rows="3" [(ngModel)]="character.competency.demerito" name="competencyDemerit"></textarea>
    </label>

    <fieldset>
      <legend>Qualidades</legend>

      <label>
        Atenção
        <input type="number" min="0" max="9" [(ngModel)]="character.qualities.attention" name="qualityAttention" />
      </label>

      <label>
        Empatia
        <input type="number" min="0" max="9" [(ngModel)]="character.qualities.empathy" name="qualityEmpathy" />
      </label>

      <label>
        Presença
        <input type="number" min="0" max="9" [(ngModel)]="character.qualities.presence" name="qualityPresence" />
      </label>

      <label>
        Duplicidade
        <input type="number" min="0" max="9" [(ngModel)]="character.qualities.duplicity" name="qualityDuplicity" />
      </label>

      <label>
        Iniciativa
        <input type="number" min="0" max="9" [(ngModel)]="character.qualities.initiative" name="qualityInitiative" />
      </label>

      <label>
        Profissionalismo
        <input type="number" min="0" max="9" [(ngModel)]="character.qualities.professionalism" name="qualityProfessionalism" />
      </label>

      <label>
        Dinamismo
        <input type="number" min="0" max="9" [(ngModel)]="character.qualities.dynamism" name="qualityDynamism" />
      </label>

      <label>
        Persistência
        <input type="number" min="0" max="9" [(ngModel)]="character.qualities.persistence" name="qualityPersistence" />
      </label>

      <label>
        Sutileza
        <input type="number" min="0" max="9" [(ngModel)]="character.qualities.subtlety" name="qualitySubtlety" />
      </label>
    </fieldset>

    <fieldset>
      <legend>Questionário</legend>

      <label>
        Aparência
        <textarea rows="2" [(ngModel)]="character.questionnaire.appearance" name="questionAppearance"></textarea>
      </label>

      <label>
        Manifestação dos poderes
        <textarea rows="2" [(ngModel)]="character.questionnaire.powersAppearance" name="questionPowers"></textarea>
      </label>

      <label>
        Café favorito
        <input type="text" name="questionCoffee"/>
      </label>

      <label>
        Experiência em Pacote Office?
        <input type="text" name="questionOfficeExperience"/>
      </label>

      <label>
        Outras Observações
        <textarea rows="2" [(ngModel)]="character.questionnaire.others" name="questionOthers"></textarea>
      </label>
    </fieldset>
  </div>

  <div>
    <button type="button" *ngIf="currentStepIndex > 0" (click)="prevStep()">Voltar</button>
    <button type="button" [disabled]="isAtCharacterLimit || (!isFormValid() && isLastStep)" (click)="nextStep()">{{ isLastStep ? 'Salvar Colaborador' : 'Próximo' }}</button>
  </div>
</section>
